<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1.0"
>

<title>MADUSANKA ADMIN</title>

<link rel="stylesheet" href="style.css">


<style>

.adminPage{

    width:90%;

    max-width:850px;

    margin:
        60px auto
        120px;
}


.adminBox{

    background:#100b16;

    border:
        1px solid #301a38;

    border-radius:20px;

    padding:25px;

    margin-bottom:20px;
}


.adminBox h2{

    margin-bottom:20px;

    font-size:22px;
}


.formGroup{

    margin-bottom:16px;
}


.formGroup label{

    display:block;

    margin-bottom:7px;

    color:#aaa;

    font-size:13px;
}


.formGroup input{

    width:100%;

    padding:14px;

    border:
        1px solid #35203d;

    border-radius:10px;

    background:#08060b;

    color:#fff;

    outline:none;
}


.formGroup input:focus{

    border-color:#c238ff;
}


.mainBtn{

    width:100%;

    padding:14px;

    border:0;

    border-radius:10px;

    background:
        linear-gradient(
            90deg,
            #a82cff,
            #ff35c8
        );

    color:white;

    font-weight:bold;

    cursor:pointer;
}


.mainBtn:disabled{

    opacity:.5;

    cursor:not-allowed;
}


.logout{

    margin-top:15px;

    background:#2b152f;
}


.status{

    margin-top:15px;

    padding:12px;

    border-radius:9px;

    background:#17101d;

    color:#aaa;

    font-size:13px;

    line-height:1.5;

    word-break:break-word;
}


#loginBox{

    max-width:430px;

    margin:
        100px auto;
}


#adminPanel{

    display:none;
}


.adminUser{

    color:#888;

    font-size:12px;

    margin-bottom:20px;
}


.songRow{

    display:flex;

    align-items:center;

    gap:13px;

    padding:
        12px 0;

    border-bottom:
        1px solid #25172b;
}


.songRow img{

    width:55px;

    height:55px;

    border-radius:8px;

    object-fit:cover;
}


.songInfo{

    flex:1;

    min-width:0;
}


.songInfo b{

    display:block;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}


.songInfo small{

    display:block;

    color:#888;

    margin-top:4px;
}


.deleteBtn{

    border:0;

    padding:
        9px 12px;

    border-radius:8px;

    background:#351522;

    color:#ff719e;

    cursor:pointer;
}


.deleteBtn:hover{

    background:#521f33;
}


.progress{

    width:100%;

    height:6px;

    background:#211526;

    border-radius:10px;

    overflow:hidden;

    margin-top:12px;

    display:none;
}


.progressBar{

    width:0%;

    height:100%;

    background:
        linear-gradient(
            90deg,
            #a82cff,
            #ff35c8
        );

    transition:.2s;
}


@media(max-width:600px){

    .songRow{

        align-items:flex-start;

    }

    .deleteBtn{

        padding:
            8px;
    }

}

</style>

</head>


<body>


<header>

    <div class="logo">

        MADUSANKA

        <span>ADMIN</span>

    </div>


    <a
        href="index.html"
        class="adminBtn"
    >
        HOME
    </a>

</header>



<!-- LOGIN -->

<section
    id="loginBox"
    class="adminBox"
>

    <h2>
        Admin Login
    </h2>


    <div class="formGroup">

        <label>
            Email
        </label>

        <input
            id="email"
            type="email"
            value="damithmadusanka179@gmail.com"
            placeholder="Admin email"
        >

    </div>


    <div class="formGroup">

        <label>
            Password
        </label>

        <input
            id="password"
            type="password"
            placeholder="Password"
        >

    </div>


    <button
        id="loginBtn"
        class="mainBtn"
    >
        LOGIN
    </button>


    <div
        id="loginStatus"
        class="status"
    ></div>

</section>



<!-- ADMIN -->

<section
    id="adminPanel"
    class="adminPage"
>


    <div class="adminBox">

        <h2>
            Song Upload
        </h2>


        <div
            id="adminUser"
            class="adminUser"
        ></div>


        <div class="formGroup">

            <label>
                Song Title
            </label>

            <input
                id="title"
                type="text"
                placeholder="Song title"
            >

        </div>


        <div class="formGroup">

            <label>
                Artist
            </label>

            <input
                id="artist"
                type="text"
                placeholder="Artist name"
            >

        </div>


        <div class="formGroup">

            <label>
                Cover Image
            </label>

            <input
                id="cover"
                type="file"
                accept="image/*"
            >

        </div>


        <div class="formGroup">

            <label>
                Audio File
            </label>

            <input
                id="audio"
                type="file"
                accept="audio/*"
            >

        </div>


        <button
            id="uploadBtn"
            class="mainBtn"
        >
            UPLOAD SONG
        </button>


        <div
            class="progress"
            id="progress"
        >

            <div
                class="progressBar"
                id="progressBar"
            ></div>

        </div>


        <div
            id="uploadStatus"
            class="status"
        ></div>

    </div>



    <div class="adminBox">

        <h2>
            Uploaded Songs
        </h2>


        <div id="adminSongs">
            Loading...
        </div>


        <button
            id="logoutBtn"
            class="mainBtn logout"
        >
            LOGOUT
        </button>

    </div>


</section>



<script
    type="module"
    src="admin.js"
></script>


</body>

</html>
