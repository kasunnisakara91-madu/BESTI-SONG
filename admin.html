<form id="loginForm">

    <label>Username</label>
    <input
        type="text"
        id="username"
        placeholder="Username"
        autocomplete="username"
        required
    >

    <label>Password</label>
    <input
        type="password"
        id="password"
        placeholder="Password"
        autocomplete="current-password"
        required
    >

    <button type="submit">
        LOGIN
    </button>

    <div id="loginMessage"></div>

</form>
